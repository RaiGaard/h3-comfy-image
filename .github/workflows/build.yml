name: build image
on:
  push:
    branches: [main]
    paths: [Dockerfile, "scripts/**", .github/workflows/build.yml]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      IMAGE: ghcr.io/raigaard/h3-comfy
    steps:
      - name: Free runner disk (base image is ~10 GB compressed)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift
          sudo docker image prune -af >/dev/null
          df -h /
      - uses: actions/checkout@v4
      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build
        run: docker build -t $IMAGE:${GITHUB_SHA::7} -t $IMAGE:latest .
      - name: Smoke test (no GPU on the runner)
        run: docker run --rm $IMAGE:latest bash -c "cat /opt/h3/VERSIONS && python -c 'import torch,spandrel,comfy_kitchen;print(torch.__version__)' && ls -la /opt/h3/models && ffmpeg -version | head -1"
      - name: Push
        run: docker push $IMAGE:${GITHUB_SHA::7} && docker push $IMAGE:latest
